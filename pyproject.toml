[project]
name = "wikipedia-ai-skill"
version = "0.0.0"
description = "日本語版 Wikipedia 風の記事を作る Claude Code スキル"
requires-python = ">=3.11"
# 配るスクリプトは標準ライブラリだけで動かす。ここには実行時の依存を足さない。
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# アプリでもライブラリでもない（スキルを配る置き場）ので、パッケージとしてはビルドしない。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/wiki/scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["skills/wiki/scripts", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "D"]
ignore = [
    # 日本語の要約行は「。」で終わるので、末尾がピリオドかを見る規則は使えない。
    "D400",
    "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# 試験関数の名前が説明を兼ねるので、docstring の有無は求めない。
"tests/**" = ["D1"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["skills", "tests", "scripts"]
extraPaths = ["skills/wiki/scripts"]
