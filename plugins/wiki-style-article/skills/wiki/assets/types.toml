[[type]]
id = "person-living"
name = "人物（存命）"
# 必須: 名前・生年月日・職業。誰が・いつ生まれ・何をする人かで、人物を一目で掴める。
# 没年月日の欄は持たない（持つのは person-deceased）。

[[type.infobox]]
template = "Infobox 人物"
required = ["名前", "生年月日", "職業"]
[type.infobox.fields]
"名前" = "氏名"
"ふりがな" = "ふりがな"
