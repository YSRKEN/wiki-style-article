# 記事の類型の定義。読み方と書き方は docs/types.md、読み込みは wikiskill/types.py。
#
# 構成
#   [[type]]                    一つの型。id が原稿の type に書く値。
#     parents = [...]           細かい種類のとき、寄せ先の基本型の id（基本型は書かない）。
#     no_infobox = true         Infobox を持たない型。持つ型は [[type.infobox]] を書く。
#   [[type.infobox]]            Infobox のテンプレート一つ分。部品は書いた順に重ねる。
#     template                  本家のテンプレート名（Template: は付けない）
#     placement                 "top"（記事の最上部。既定）か "lead"（導入部の中）
#     title_field               記事名を既定値にする項目の項目名（必須にはしない）
#     required                  原稿に必ず書く項目の項目名
#     unverified                引数名を本家で確かめられていない項目の項目名
#   [type.infobox.fields]       "日本語の項目名" = "テンプレートの引数名"。書いた順が表示の順
#
# 根拠と方針
#   - テンプレートと引数名は、2026-11-02 に ja.wikipedia.org の Template: の本文（MediaWiki API）で
#     引数として存在することを確かめた。この日付の時点で未確認の引数はない。
#   - required は「題材を一目で掴める項目」に絞る。本家で多くの記事が埋めている項目と、テンプレート自身が
#     必須とする項目（TemplateData の required）から選び、迷ったら必須にしない。
#   - 記事名と同じになる項目（名称・タイトルなど）は title_field にして required にしない。
#     人物の氏名は記事名に「(8代目)」のような曖昧さ回避が付くので、title_field にせず required にする。
#   - 日本語の項目名は型の中で一意。部品をまたいでも重ならないようにする。
#   - 番号つきの引数（clubs1・combatant1 など、行を増やすもの）は含めない。
#   - 型の並びは題材の近いものを続けて置く。基本型の直後に、その寄せ先の細かい種類を置く（人物・出来事・場所など）。


